name: newapp
description: "Plateforme de Santé et Prise de Rendez-Vous Médicaux (Flutter + Firebase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ✅ Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # ✅ Notifications
  flutter_local_notifications: ^17.2.2

  # ✅ Scan / QR
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0

  # ✅ UI / Animations
  confetti: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ✅ State management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  get_it: ^7.7.0
  equatable: ^2.0.5

  # ✅ Utils
  intl: ^0.19.0
  http: ^1.2.2
  dio: ^5.7.0

  # ✅ Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2

  # ✅ Calendar
  table_calendar: ^3.1.2

  # ✅ Images
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/doctors/cardiologue/
    - assets/doctors/dentiste/
    - assets/doctors/medecine_generale/
    - assets/doctors/pediatre/