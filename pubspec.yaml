name: newapp
description: "Plateforme de Santé et Prise de Rendez-Vous Médicaux (Flutter + NodeJS + Firebase)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.0.7


  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  get_it: ^7.7.0
  equatable: ^2.0.5
  intl: ^0.19.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2

  http: ^1.2.2
  dio: ^5.7.0

  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.2

  flutter_local_notifications: ^17.2.2

  table_calendar: ^3.1.2

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/doctors/cardiologue/
    - assets/doctors/dentiste/
    - assets/doctors/medecine_generale/
    - assets/doctors/pediatre/
    - assets/users/